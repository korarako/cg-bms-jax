defaults:
  - experiment: mb2d_analytic_equilibrium_bridge
  - _self_

# This seed controls only the immutable endpoint dataset. Training seeds are
# specified independently by the formal experiment runner.
seed: 20260725
output: data/mb2d_equilibrium_exact_v1/endpoints.npz
overwrite: false

dataset:
  # A 1024^2 midpoint quadrature is sampled with uniform within-cell jitter.
  grid_resolution: [1024, 1024]
  num_train: 100000
  num_validation: 50000
  num_test: 100000
  validation_bins: 120
  maximum_histogram_js: 0.04
  maximum_basin_l1: 0.02
  grid_convergence_resolution: [512, 1024]
  maximum_grid_energy_mean_delta: 0.01
  maximum_grid_basin_l1: 0.002
