defaults:
  - experiment: mb2d_analytic
  - _self_

# Analytic flat-state warm start.  Endpoint provenance lives inside the
# experiment config so the same identity is available to train_forward when
# this checkpoint is used as a parameters-only initializer.
seed: 0
output_dir: outputs/${experiment.name}/bridge_pretrain
progress_every: 100
checkpoint_every: 10000
save_endpoint_bank: true

pretrain:
  updates: 100000
  batch_size: 256
  learning_rate: 3.0e-4
  final_learning_rate: 1.0e-4
  learning_rate_warmup_updates: 5000
  learning_rate_decay_updates: 100000
  learning_rate_warmup_start_factor: 1.0e-3
  gradient_clip_norm: 100.0
  weight_decay: 1.0e-3
  bridge_matching_max_time: 0.99
