defaults:
  - ala2_ambient18_300k
  - _self_

# d19a27b public-release fidelity control, except for CG-BG's required ambient
# COM lift and the PMF substitution.  It is kept separate from the paper's
# final damped eta=10 configuration so the two versions are never mixed.
name: ala2_ambient18_300k_bms_release_s1_gate2k

model:
  num_features: 128
  num_layers: 4

sde:
  sigma_min: 0.01
  sigma_max: 1.0
  rho: 7.0
  steps: 100

training:
  outer_iterations: 20
  rollout_samples: 256
  buffer_capacity: 2048
  batch_size: 64
  gradient_steps: 100
  learning_rate: 1.0e-4
  final_learning_rate: 1.0e-5
  learning_rate_warmup_updates: 5000
  learning_rate_decay_updates: 700000
  learning_rate_warmup_start_factor: 1.0e-3
  damping: 0.0
  previous_model_interval_outer: 25
  gradient_clip_norm: 100.0
  weight_decay: 1.0e-3
  terminal_score_clip_norm: 100.0
  terminal_score_clip_preserve_mean: true
  time_epsilon: 1.0e-5
