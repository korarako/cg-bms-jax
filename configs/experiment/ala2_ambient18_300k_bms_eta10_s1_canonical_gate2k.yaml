defaults:
  - ala2_ambient18_300k_bms_eta10_s1_gate2k
  - _self_

# First causal gate for the canonical-support target.  Controller, source,
# SDE, replay, optimizer, clipping, and update counts are inherited unchanged.
# Only U is replaced by a globally defined physical target:
#
#   V = U_fixed_bonds + U_fixed_angles + U_nonbonded_repulsion
#   U = U_max + exp(-V/E_gate) * (window(U_CG-BG_PMF) - U_max) + V
#
# The guards encode local molecular topology, not phi/psi populations.  Their
# flat regions cover the published PMF training support with a broad margin.
# U_CB is deliberately absent from this first gate because its torsion gradient
# is singularly large before a molecular backbone has formed.
name: ala2_ambient18_300k_bms_eta10_s1_canonical_gate2k

target:
  mode: pmf_canonical_support
  implementation_abi: ala2_canonical_support_v2

  # The published support is approximately [-313.6,-248.2] kJ/mol.  The
  # padded window is exponentially close to identity there, but saturates
  # both spurious OOD wells and arbitrarily high/random MACE forces.
  pmf_energy_window:
    minimum_kj_mol: -330.0
    maximum_kj_mol: -230.0
    lower_softness_kj_mol: 2.5
    upper_softness_kj_mol: 2.5

  # PMF is exactly on (gate=1) whenever every topology guard is in its flat
  # region.  Far from molecular topology it is continuously switched off,
  # leaving only the globally restorative V.  Anchoring at U_max makes the
  # gate derivative reinforce V instead of reversing it.
  pmf_topology_gate:
    energy_scale_kj_mol: 25.0

  canonical_support:
    # 0 ACE-C, 1 ALA-N, 2 ALA-CA, 3 ALA-CB, 4 ALA-C, 5 NME-N
    bond_indices: [[0, 1], [1, 2], [2, 3], [2, 4], [4, 5]]
    bond_lower_nm: [0.110, 0.120, 0.130, 0.130, 0.110]
    bond_upper_nm: [0.155, 0.175, 0.180, 0.180, 0.155]
    bond_force_constant_kj_mol_nm2: 10000.0

    # Broad local covalent angles only; no backbone torsion/Rama target.
    angle_indices: [[0, 1, 2], [1, 2, 3], [1, 2, 4], [3, 2, 4], [2, 4, 5]]
    angle_lower_rad: [1.6580627893946132, 1.3962634015954636, 1.3962634015954636, 1.3962634015954636, 1.5707963267948966]
    angle_upper_rad: [2.705260340591211, 2.443460952792061, 2.530727415391778, 2.530727415391778, 2.530727415391778]
    angle_force_constant_kj_mol_rad2: 250.0

    # All ten nonbonded pairs.  The published mapped data have minimum
    # nonbonded separation >0.217 nm, so the 0.18 nm flat edge is inactive.
    repulsion_indices: [[0, 2], [0, 3], [0, 4], [0, 5], [1, 3], [1, 4], [1, 5], [2, 5], [3, 4], [3, 5]]
    repulsion_min_nm: 0.180
    repulsion_force_constant_kj_mol_nm2: 10000.0
