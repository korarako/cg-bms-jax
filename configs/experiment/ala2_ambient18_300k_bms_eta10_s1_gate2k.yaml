defaults:
  - ala2_ambient18_300k
  - _self_

# Resource-adapted version of the paper's successful damped Ala2 line.
# The user-selected 128x5 PaiNN is retained.  This arm keeps sigma_max near
# one standardized source unit so that the six-bead MACE graph stays connected.
name: ala2_ambient18_300k_bms_eta10_s1_gate2k

model:
  num_features: 128
  num_layers: 5

sde:
  # 0.001 Angstrom converted by the asset scale 0.983713 Angstrom / x-unit.
  sigma_min: 0.00101656
  sigma_max: 1.0
  rho: 3.0
  steps: 50

training:
  outer_iterations: 20
  rollout_samples: 2048
  buffer_capacity: 16384
  batch_size: 64
  gradient_steps: 100
  learning_rate: 1.0e-4
  final_learning_rate: 3.0e-5
  learning_rate_decay_updates: 500000
  damping: 10.0
  previous_model_interval_outer: 1
  gradient_clip_norm: 100.0
  weight_decay: 1.0e-3
  terminal_score_clip_norm: 100.0
  terminal_score_clip_preserve_mean: true
  time_epsilon: 1.0e-5
