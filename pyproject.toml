[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cg-bms-jax"
version = "0.1.1"
description = "Pure-JAX bridge matching samplers and exact-density reweighting for Boltzmann distributions"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = {file = "LICENSE"}
authors = [{name = "cg-bms-jax contributors"}]
keywords = ["jax", "molecular-sampling", "boltzmann-generator", "bridge-matching"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "numpy==1.26.4",
  "scipy==1.12.0",
  "jax==0.4.38",
  "flax==0.10.4",
  "optax==0.2.5",
  "equinox==0.13.7",
  "diffrax==0.7.2",
  "orbax-checkpoint>=0.11,<0.12",
  "hydra-core==1.3.2",
  "omegaconf==2.3.0",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "rich>=13,<16",
  "huggingface-hub>=0.29,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
pmf = [
  "dm-haiku>=0.0.13,<0.1",
  "jax-md==0.2.8",
  "e3nn-jax==0.21.0",
  "jraph>=0.0.6.dev0",
]
all_atom = [
  "openmm>=8.1,<9",
]
eval = ["ott-jax>=0.5,<0.6"]
[project.scripts]
cg-bms-train-forward = "cg_bms_jax.experiment.train_forward:main"
cg-bms-sample-sde = "cg_bms_jax.experiment.sample_sde:main"
cg-bms-train-backward = "cg_bms_jax.experiment.train_backward:main"
cg-bms-sample-reweight = "cg_bms_jax.experiment.sample_reweight:main"
cg-bms-evaluate = "cg_bms_jax.experiment.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cg_bms_jax"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "cg_bms_jax/configs"
"assets/manifest.yaml" = "cg_bms_jax/assets/manifest.yaml"
"LICENSES" = "cg_bms_jax/LICENSES"
"THIRD_PARTY_NOTICES.md" = "cg_bms_jax/THIRD_PARTY_NOTICES.md"
"UPSTREAM.md" = "cg_bms_jax/UPSTREAM.md"
