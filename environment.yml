# Core environment only.  For the validated Ala2 MACE stack, use
# scripts/create_env.sh so ChemTrain/ChemUtils are installed without letting
# their legacy metadata downgrade JAX 0.4.38.
name: cg-bms-jax
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -e .[pmf,eval,dev]
      - jax-cuda12-plugin==0.4.38
      - jax-cuda12-pjrt==0.4.38
